[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "comet-ml>=3.49.1",
  "duckdb>=1.4.2",
  "python-dotenv>=1.1.0",
  "hmmlearn>=0.3.3",
  "ipykernel>=6.29.5",
  "matplotlib>=3.10.0",
  "nbformat>=5.10.4",
  "numpy>=2.2.3",
  "pandas>=2.2.3",
  "pandas-stubs>=2.2.3.250308",
  "plotly>=6.0.0",
  "pyarrow>=26.0.0",
  "pydantic>=2.10.6",
  "pygad>=3.4.0",
  "pytorch-lightning>=2.5.0.post0",
  "pywavelets>=1.8.0",
  "scienceplots>=2.1.1",
  "scikit-learn>=1.6.1",
  "scipy>=1.15.2",
  "scipy-stubs~=1.15.2",
  "tensorboard>=2.20.0",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "tqdm>=4.67.1",
]

[tool.uv.sources]
torch = [
    {index = "pytorch-cu124"},
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
